{% extends "shared/base.html" %}
{% block title %}เข้าสู่ระบบ{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white dark:bg-gray-800 p-6 rounded-lg shadow mt-10">
  <h1 class="text-2xl font-bold mb-4 text-center">เข้าสู่ระบบ</h1>
  <form method="post" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">อีเมล หรือ ชื่อผู้ใช้</label>
      <input type="text" name="email" required class="w-full border dark:border-gray-600 rounded px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100"
             placeholder="กรอกอีเมล หรือ ชื่อที่ใช้สมัคร">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">รหัสผ่าน</label>
      <div class="relative">
        <input type="password" name="password" id="password" required class="w-full border dark:border-gray-600 rounded px-3 py-2 pr-10 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100">
        <button type="button" onclick="togglePw()" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:text-gray-300 text-sm">
          <span id="pw-icon">👁️</span>
        </button>
      </div>
    </div>
    <button type="submit" class="w-full bg-red-600 text-white py-2 rounded hover:bg-red-700">เข้าสู่ระบบ</button>
  </form>
  <p class="text-sm text-center mt-4">
    ยังไม่มีบัญชี? <a href="{{ url_for('auth.register') }}" class="text-red-700 hover:underline">สมัครสมาชิก</a>
  </p>
</div>
<script>
function togglePw() {
  const input = document.getElementById('password');
  const icon = document.getElementById('pw-icon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.textContent = '🙈';
  } else {
    input.type = 'password';
    icon.textContent = '👁️';
  }
}
</script>
{% endblock %}
