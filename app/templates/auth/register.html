{% extends "shared/base.html" %}
{% block title %}สมัครสมาชิก{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white dark:bg-gray-800 p-6 rounded-lg shadow mt-10">
  <h1 class="text-2xl font-bold mb-4 text-center">สมัครสมาชิก</h1>
  <form method="post" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">ชื่อ-นามสกุล</label>
      <input type="text" name="full_name" required class="w-full border rounded px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">อีเมล</label>
      <input type="email" name="email" id="email" required
             pattern="[^\s@]+@[^\s@]+\.[^\s@]+"
             title="กรุณากรอกอีเมลให้ถูกต้อง เช่น name@example.com"
             class="w-full border rounded px-3 py-2">
      <p class="text-xs text-gray-400 dark:text-gray-500 mt-1">ต้องมี @ และ . เช่น somchai@gmail.com</p>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">รหัสผ่าน</label>
      <div class="relative">
        <input type="password" name="password" id="password" required minlength="6" class="w-full border rounded px-3 py-2 pr-10">
        <button type="button" onclick="togglePw()" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:text-gray-300 text-sm">
          <span id="pw-icon">👁️</span>
        </button>
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">สมัครในฐานะ</label>
      <select name="role" id="role" onchange="document.getElementById('shop_name_field').classList.toggle('hidden', this.value !== 'seller')"
        class="w-full border rounded px-3 py-2">
        <option value="buyer">ผู้ซื้อ</option>
        <option value="seller">ผู้ขาย</option>
      </select>
    </div>
    <div id="shop_name_field" class="hidden">
      <label class="block text-sm font-medium mb-1">ชื่อร้านค้า</label>
      <input type="text" name="shop_name" class="w-full border rounded px-3 py-2">
    </div>
    <button type="submit" class="w-full bg-red-600 text-white py-2 rounded hover:bg-red-700">สมัครสมาชิก</button>
  </form>
  <p class="text-sm text-center mt-4">
    มีบัญชีอยู่แล้ว? <a href="{{ url_for('auth.login') }}" class="text-red-700 hover:underline">เข้าสู่ระบบ</a>
  </p>
</div>
<script>
function togglePw() {
  const input = document.getElementById('password');
  const icon = document.getElementById('pw-icon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.textContent = '🙈';
  } else {
    input.type = 'password';
    icon.textContent = '👁️';
  }
}
</script>
{% endblock %}
