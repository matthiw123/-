{% extends "shared/base.html" %}
{% block title %}แก้ไขสินค้า{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">แก้ไขสินค้า</h1>

<div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6 max-w-2xl">
  <form method="post" enctype="multipart/form-data" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">ชื่อสินค้า</label>
      <input type="text" name="name" value="{{ product.name }}" required class="w-full border rounded px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">รายละเอียดสินค้า</label>
      <textarea name="description" rows="4" class="w-full border rounded px-3 py-2">{{ product.description or '' }}</textarea>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium mb-1">ราคา (บาท)</label>
        <input type="number" step="0.01" min="0" name="price" value="{{ product.price }}" required class="w-full border rounded px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">จำนวนสต๊อก</label>
        <input type="number" min="0" name="stock" value="{{ product.stock }}" required class="w-full border rounded px-3 py-2">
      </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium mb-1">ประเภทเกม</label>
        <select name="category_id" class="w-full border rounded px-3 py-2">
          <option value="">-- เลือกประเภทเกม --</option>
          {% for c in categories %}
          <option value="{{ c.id }}" {{ 'selected' if product.category_id == c.id }}>{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">สภาพสินค้า</label>
        <select name="condition" class="w-full border rounded px-3 py-2">
          <option value="new" {{ 'selected' if product.condition == 'new' }}>มือ 1 (ใหม่)</option>
          <option value="used" {{ 'selected' if product.condition == 'used' }}>มือ 2 (มือสอง)</option>
        </select>
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">ลิงก์วิดีโอตัวอย่าง/รีวิวเกม (ถ้ามี)</label>
      <input type="url" name="video_url" value="{{ product.video_url or '' }}" placeholder="เช่น https://www.youtube.com/watch?v=..." class="w-full border rounded px-3 py-2">
    </div>

    <p class="text-xs text-gray-400 dark:text-gray-500">* แก้ไขแล้วสินค้าจะกลับไปสถานะ "รอตรวจสอบ" อีกครั้ง</p>

    <div class="border-t pt-4">
      <h3 class="font-semibold mb-2">รูปภาพสินค้า</h3>
      {% if images %}
      <div class="grid grid-cols-4 gap-3 mb-3">
        {% for img in images %}
        <div class="border rounded p-2 text-center">
          <img src="{{ img.image_url }}" class="w-full aspect-square object-cover rounded mb-1">
          <label class="flex items-center justify-center gap-1 text-xs mb-1">
            <input type="radio" name="cover_image_id" value="{{ img.id }}" {{ 'checked' if img.is_cover }}>
            รูปปก
          </label>
          <label class="flex items-center justify-center gap-1 text-xs text-red-500">
            <input type="checkbox" name="delete_image_ids" value="{{ img.id }}">
            ลบรูปนี้
          </label>
        </div>
        {% endfor %}
      </div>
      {% else %}
      <p class="text-xs text-gray-400 dark:text-gray-500 mb-3">ยังไม่มีรูปภาพ</p>
      {% endif %}
      <label class="block text-sm font-medium mb-1">เพิ่มรูปภาพใหม่</label>
      <input type="file" name="new_images" multiple accept="image/*" class="w-full border rounded px-3 py-2">
    </div>

    <button type="submit" class="bg-red-600 text-white px-6 py-2 rounded hover:bg-red-700">บันทึกการแก้ไข</button>
  </form>
</div>
{% endblock %}
